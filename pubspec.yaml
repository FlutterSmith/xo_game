name: advanced_xo_game
description: Advanced Tic Tac Toe game with enhanced UI/UX, adaptive AI,
  undo/redo and game history using BLoC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.2
  equatable: ^2.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  path: ^1.8.0
  sqflite: ^2.0.0+4
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  vibration: ^2.0.0
  share_plus: ^7.2.1
  fl_chart: ^0.66.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  intl: ^0.18.1
  file_picker: ^10.3.3
  confetti: ^0.7.0
  lottie: ^3.0.0

dev_dependencies:
  flutter_launcher_icons: "^0.14.3"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/sounds/
    - assets/sounds/music/

  # Only two families are used app-wide: Poppins (display) + Inter (body).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  macos: true
  windows: true

  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
